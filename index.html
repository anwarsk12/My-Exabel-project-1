<!DOCTYPE html>
<html>
<head>
<title>AI Image Generator</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  #result { margin-top: 20px; }
  img { max-width: 100%; height: auto; border-radius: 8px; }
</style>
</head>
<body>

<h1>AI Image Generator</h1>
<input type="text" id="prompt" placeholder="Describe the image" style="width: 300px; padding: 10px;">
<button onclick="generateImage()" style="padding: 10px;">Generate</button>

<div id="result"></div>

<script>
async function generateImage() {
  const prompt = document.getElementById('prompt').value;
  const apiKey = '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';
  const resultDiv = document.getElementById('result');
  
  resultDiv.innerText = 'Loading...';

  try {
    const response = await fetch(
      'https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1',
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ inputs: prompt })
      }
    );

    const blob = await response.blob();
    const imageUrl = URL.createObjectURL(blob);
    resultDiv.innerHTML = `<img src="${imageUrl}">`;
  } catch (error) {
    resultDiv.innerText = 'Failed to generate image.';
  }
}
</script>

</body>
</html>
