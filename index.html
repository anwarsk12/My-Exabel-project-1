<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen AI Generator</title>
<style>
  :root {
    --primary-glow: #6366f1;
    --secondary-glow: #ec4899;
    --bg-base: #090d16;
    --text-main: #f8fafc;
    --text-muted: #64748b;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(0,0,0,0) 70%);
    top: -100px;
    left: -100px;
    z-index: 1;
  }
  body::after {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(236,72,153,0.1) 0%, rgba(0,0,0,0) 70%);
    top: 300px;
    right: -100px;
    z-index: 1;
  }
  .container {
    width: 100%;
    max-width: 900px;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  .badge {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--secondary-glow);
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 800;
    text-align: center;
    letter-spacing: -1px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.subtitle {
    color: var(--text-muted);
    font-size: 1.1rem;
    text-align: center;
    max-width: 600px;
    margin-bottom: 40px;
  }
  .input-wrapper {
    width: 100%;
    background: rgba(15, 23, 42, 0.7);
    padding: 12px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    gap: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(99, 102, 241, 0.2);
    backdrop-filter: blur(20px);
  }
  input[type="text"] {
    flex-grow: 1;
    background: transparent;
    border: none;
    padding: 12px 16px;
    color: #fff;
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]::placeholder {
    color: #475569;
  }
  button {
    background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
    color: white;
    border: none;
    padding: 16px 32px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    filter: brightness(1.1);
  }
  #result {
    margin-top: 48px;
    width: 100%;
    display: flex;
    justify-content: center;
    min-height: 300px;
  }
  img {
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: fadeIn 0.5s ease;
  }
  .loader {
    width: 48px;
    height: 48px;
    border: 3px solid #1e293b;
    border-bottom-color: var(--primary-glow);
    border-radius: 50%;
    display: inline-block;
    box-sizing: border-box;
    animation: rotation 1s linear infinite;
    margin-top: 100px;
  }
  @keyframes rotation {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">Next-Gen AI Engine</div>
  <h1>Bring your imagination to life.</h1>
  <p class="subtitle">Transform descriptive text into stunning, high-definition visual art in seconds with cutting-edge diffusion models.</p>
  
  <div class="input-wrapper">
    <input type="text" id="prompt" placeholder=" Describe the image you want to create...">
    <button onclick="generateImage()">Generate</button>
  </div>

  <div id="result"></div>
</div>

<script>
async function generateImage() {
  const prompt = document.getElementById('prompt').value;
  const apiKey = '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';
  const resultDiv = document.getElementById('result');
  
  if(!prompt.trim()) return;

  resultDiv.innerHTML = '<span class="loader"></span>';

  try {
    const response = await fetch(
      'https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1',
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ inputs: prompt })
      }
    );

    const blob = await response.blob();
    const imageUrl = URL.createObjectURL(blob);
    resultDiv.innerHTML = `<img src="${imageUrl}" alt="Generated Art">`;
  } catch (error) {
    resultDiv.innerHTML = '<p style="color:#ef4444; margin-top:100px;">Failed to generate image.</p>';
  }
}
</script>

</body>
</html>
